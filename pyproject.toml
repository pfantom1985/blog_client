[project]
name = "blog-client"
version = "0.1.0"
description = "CLI tool for JSONPlaceholder API"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "pydantic[email]>=2.0.0",
  "python-json-logger>=2.0.0",
]

[project.scripts]
blog-client = "blog_client.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
